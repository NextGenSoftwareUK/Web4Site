<style>
  :root {
    --bg: #0f1117;
    --bg2: #161b27;
    --bg3: #1e2535;
    --border: #2a3346;
    --text: #e2e8f0;
    --muted: #8892a4;
    --accent: #4f8ef7;
    --evm: #a78bfa;
    --blockchain: #34d399;
    --storage: #60a5fa;
    --storage-local: #3b82f6;
    --cloud: #38bdf8;
    --network: #fb923c;
    --social: #f472b6;
    --identity: #fbbf24;
    --spatial: #86efac;
    --ai: #e879f9;
    --app: #94a3b8;
    --other: #94a3b8;
    --warn: #f59e0b;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f8fafc; --bg2: #ffffff; --bg3: #f1f5f9;
      --border: #e2e8f0; --text: #0f172a; --muted: #64748b;
    }
  }
  :root[data-theme="light"] {
    --bg: #f8fafc; --bg2: #ffffff; --bg3: #f1f5f9;
    --border: #e2e8f0; --text: #0f172a; --muted: #64748b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; font-size: 13px; padding: 20px 16px; }

  h1 { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 4px; letter-spacing: -0.3px; }
  .subtitle { color: var(--muted); font-size: 12px; margin-bottom: 20px; }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
  .controls input { background: var(--bg2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 6px 10px; font-size: 12px; width: 220px; outline: none; }
  .controls input:focus { border-color: var(--accent); }
  .controls select { background: var(--bg2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 6px 10px; font-size: 12px; outline: none; cursor: pointer; }
  .controls select:focus { border-color: var(--accent); }
  .count { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .clear-btn { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; transition: border-color .15s, color .15s; }
  .clear-btn:hover { border-color: var(--accent); color: var(--text); }

  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .legend .badge { cursor: pointer; opacity: 0.85; transition: opacity 0.1s; }
  .legend .badge:hover { opacity: 1; }

  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; }
  thead tr { background: var(--bg3); }
  th { padding: 9px 12px; text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none; }
  th:hover { color: var(--text); }
  th .sort-icon { display: inline-block; margin-left: 4px; opacity: 0.4; font-style: normal; }
  th.sort-asc .sort-icon, th.sort-desc .sort-icon { opacity: 1; color: var(--accent); }
  td { padding: 7px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg3); }
  .folder { color: var(--muted); font-size: 11px; }
  .provider-name { font-weight: 600; font-size: 12px; }
  .warn-icon { color: var(--warn); margin-left: 4px; font-size: 10px; }
  .caps-cell { display: flex; flex-wrap: wrap; gap: 3px; }
  .hidden { display: none; }

  /* category badge colors */
  .b-EVMBlockchain { background: #3b1fa833; color: var(--evm); border: 1px solid #4c2d9a55; }
  .b-Blockchain { background: #064e3b33; color: var(--blockchain); border: 1px solid #06744655; }
  .b-Storage { background: #1e3a5f33; color: var(--storage); border: 1px solid #2563eb55; }
  .b-StorageLocal { background: #1e3a8a33; color: var(--storage-local); border: 1px solid #3b82f655; }
  .b-StorageAndNetwork { background: #7f1d1d33; color: var(--warn); border: 1px solid #b45c0c55; }
  .b-Cloud { background: #0c4a6e33; color: var(--cloud); border: 1px solid #0284c755; }
  .b-Network { background: #431407aa; color: var(--network); border: 1px solid #ea580c55; }
  .b-Social { background: #500724aa; color: var(--social); border: 1px solid #db277755; }
  .b-Identity { background: #451a0333; color: var(--identity); border: 1px solid #d9770655; }
  .b-Spatial { background: #052e1633; color: var(--spatial); border: 1px solid #16a34a55; }
  .b-AI { background: #3b0764aa; color: var(--ai); border: 1px solid #a21caf55; }
  .b-Application { background: #1e293b55; color: var(--app); border: 1px solid #47556955; }
  .b-NFT { background: #3b1f4a33; color: #c084fc; border: 1px solid #9333ea55; }
  .b-SmartContract { background: #1f3a2a33; color: #6ee7b7; border: 1px solid #10b98155; }
  .b-KeyManager { background: #3a1f0033; color: #fca5a5; border: 1px solid #ef444455; }
  .b-None { background: #1e2535; color: var(--muted); border: 1px solid var(--border); }
</style>

  "AzureStorageOASIS": "Cloud in caps is redundant (primary is Cloud)",
  "Neo4jOASIS.Aura": "Primary should be Storage, not StorageAndNetwork",
};

const catColors = {
  EVMBlockchain:"b-EVMBlockchain", Blockchain:"b-Blockchain",
  Storage:"b-Storage", StorageLocal:"b-StorageLocal", StorageAndNetwork:"b-StorageAndNetwork",
  Cloud:"b-Cloud", Network:"b-Network", Social:"b-Social", Identity:"b-Identity",
  Spatial:"b-Spatial", AI:"b-AI", Application:"b-Application",
  NFT:"b-NFT", SmartContract:"b-SmartContract", KeyManager:"b-KeyManager",
  Blockchain2:"b-Blockchain", None:"b-None"
};

function badge(val) {
  const cls = catColors[val] || "b-None";
  return `<span class="badge ${cls}">${val}</span>`;
}

// Build legend
const allCats = [...new Set(providers.map(p => p[2]))].sort();
const legend = document.getElementById('legend');
allCats.forEach(cat => {
  const b = document.createElement('span');
  b.className = 'badge ' + (catColors[cat]||'b-None');
  b.textContent = cat;
  b.title = 'Filter by ' + cat;
  b.addEventListener('click', () => {
    const sel = document.getElementById('catFilter');
    sel.value = sel.value === cat ? '' : cat;
    render();
  });
  legend.appendChild(b);
});

// Populate filters
const folders = [...new Set(providers.map(p => p[0]))].sort();
const folderSel = document.getElementById('folderFilter');
folders.forEach(f => { const o = document.createElement('option'); o.value = f; o.textContent = f; folderSel.appendChild(o); });

const catSel = document.getElementById('catFilter');
allCats.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; catSel.appendChild(o); });

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const folder = folderSel.value;
  const cat = catSel.value;
  const tbody = document.getElementById('tbody');
  let rows = '', count = 0;

  const sorted = [...providers].sort((a, b) => {
    let av = sortCol === 3 ? a[3].join(', ') : a[sortCol];
    let bv = sortCol === 3 ? b[3].join(', ') : b[sortCol];
    return av.localeCompare(bv) * sortDir;
  });

  sorted.forEach(([f, name, c, caps]) => {
    if (folder && f !== folder) return;
    if (cat && c !== cat) return;
    if (q && !name.toLowerCase().includes(q) && !c.toLowerCase().includes(q) && !caps.join(' ').toLowerCase().includes(q)) return;
    count++;
    const warn = issues[name] ? `<span class="warn-icon" title="${issues[name]}">⚠</span>` : '';
    const capsHtml = caps.length ? caps.map(badge).join('') : '<span style="color:var(--muted);font-size:11px">—</span>';
    rows += `<tr>
      <td class="folder">${f}</td>
      <td class="provider-name">${name}${warn}</td>
      <td>${badge(c)}</td>
      <td><div class="caps-cell">${capsHtml}</div></td>
    </tr>`;
  });

  tbody.innerHTML = rows;
  document.getElementById('count').textContent = count + ' of ' + providers.length + ' providers';
}

let sortCol = 0, sortDir = 1; // default: folder asc

document.querySelectorAll('th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = parseInt(th.dataset.col);
    if (sortCol === col) sortDir = -sortDir;
    else { sortCol = col; sortDir = 1; }
    document.querySelectorAll('th[data-col]').forEach(h => {
      h.classList.remove('sort-asc', 'sort-desc');
      h.querySelector('.sort-icon').textContent = '↕';
    });
    th.classList.add(sortDir === 1 ? 'sort-asc' : 'sort-desc');
    th.querySelector('.sort-icon').textContent = sortDir === 1 ? '↑' : '↓';
    render();
  });
});
// Set initial sort indicator
document.querySelector('th[data-col="0"]').classList.add('sort-asc');
document.querySelector('th[data-col="0"] .sort-icon').textContent = '↑';

document.getElementById('search').addEventListener('input', render);
folderSel.addEventListener('change', render);
catSel.addEventListener('change', render);
document.getElementById('clearBtn').addEventListener('click', () => {
  document.getElementById('search').value = '';
  folderSel.value = '';
  catSel.value = '';
  render();
});
render();
</script>
